<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1520" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F3EA"/>
      <stop offset="0.5" stop-color="#F1E8D7"/>
      <stop offset="1" stop-color="#E8DCC8"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F4EEE3"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8F1E7"/>
      <stop offset="1" stop-color="#EADBC6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D6653C"/>
      <stop offset="1" stop-color="#AE3F27"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7B5B3E" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L11 7L2 12" fill="none" stroke="#8A5A3B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #2B1E16; }
      .subtitle { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #5F4A3B; }
      .section { font: 700 18px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.08em; fill: #A04A2A; }
      .cardTitle { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #231811; }
      .cardBody { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #5B483A; }
      .small { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #7A6250; }
    </style>
  </defs>

  <rect width="1600" height="960" rx="36" fill="url(#bg)"/>
  <circle cx="1465" cy="130" r="92" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="180" cy="820" r="122" fill="#FFFFFF" fill-opacity="0.18"/>
  <circle cx="1320" cy="780" r="150" fill="#FFFFFF" fill-opacity="0.16"/>

  <text x="120" y="112" class="title">Lyric Generator Pipeline</text>
  <text x="120" y="148" class="subtitle">From Spotify link to exported brat-style lyric video</text>

  <text x="120" y="212" class="section">INPUT</text>
  <text x="470" y="212" class="section">DISCOVERY</text>
  <text x="845" y="212" class="section">LYRICS + TIMING</text>
  <text x="1205" y="212" class="section">EXPORT</text>

  <g filter="url(#shadow)">
    <rect x="120" y="250" width="250" height="170" rx="28" fill="url(#cardA)"/>
    <rect x="120" y="250" width="250" height="170" rx="28" stroke="#D9C7AF"/>
    <text x="150" y="308" class="cardTitle">Frontend</text>
    <text x="150" y="340" class="cardBody">Paste Spotify track URL</text>
    <text x="150" y="369" class="cardBody">Start generation job</text>
    <text x="150" y="404" class="small">frontend/index.html + app.js</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="250" width="300" height="170" rx="28" fill="url(#cardA)"/>
    <rect x="430" y="250" width="300" height="170" rx="28" stroke="#D9C7AF"/>
    <text x="460" y="308" class="cardTitle">FastAPI + Queue</text>
    <text x="460" y="340" class="cardBody">Creates job ID</text>
    <text x="460" y="369" class="cardBody">Runs background pipeline worker</text>
    <text x="460" y="404" class="small">backend/main.py + backend/jobs.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="250" width="300" height="170" rx="28" fill="url(#cardA)"/>
    <rect x="790" y="250" width="300" height="170" rx="28" stroke="#D9C7AF"/>
    <text x="820" y="308" class="cardTitle">Spotify Metadata</text>
    <text x="820" y="340" class="cardBody">Validate track URL</text>
    <text x="820" y="369" class="cardBody">Fetch title, artist, duration</text>
    <text x="820" y="404" class="small">backend/services/spotify.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1150" y="250" width="320" height="170" rx="28" fill="url(#cardA)"/>
    <rect x="1150" y="250" width="320" height="170" rx="28" stroke="#D9C7AF"/>
    <text x="1180" y="308" class="cardTitle">Video Export</text>
    <text x="1180" y="340" class="cardBody">Record in Playwright</text>
    <text x="1180" y="369" class="cardBody">Mux audio + video with ffmpeg</text>
    <text x="1180" y="404" class="small">generate_brat.py + data/outputs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="500" width="300" height="250" rx="28" fill="url(#cardB)"/>
    <rect x="430" y="500" width="300" height="250" rx="28" stroke="#D1B89A"/>
    <text x="460" y="558" class="cardTitle">Audio Source</text>
    <text x="460" y="593" class="cardBody">1. Scan local library</text>
    <text x="460" y="622" class="cardBody">2. Match track metadata</text>
    <text x="460" y="651" class="cardBody">3. Fallback to yt-dlp download</text>
    <text x="460" y="692" class="small">services/library.py</text>
    <text x="460" y="716" class="small">services/downloader.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="500" width="300" height="250" rx="28" fill="url(#cardB)"/>
    <rect x="790" y="500" width="300" height="250" rx="28" stroke="#D1B89A"/>
    <text x="820" y="558" class="cardTitle">Lyric Timing</text>
    <text x="820" y="593" class="cardBody">LRCLIB synced lyrics</text>
    <text x="820" y="622" class="cardBody">Optional WhisperX alignment</text>
    <text x="820" y="651" class="cardBody">Auto CPU / GPU fallback</text>
    <text x="820" y="692" class="small">services/lyrics.py</text>
    <text x="820" y="716" class="small">auto-detect runtime settings</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1150" y="500" width="320" height="250" rx="28" fill="url(#accent)"/>
    <rect x="1150" y="500" width="320" height="250" rx="28" stroke="#96351F" stroke-opacity="0.4"/>
    <text x="1180" y="558" class="cardTitle" fill="#FFF8F3">Final Output</text>
    <text x="1180" y="593" class="cardBody" fill="#FBE9DF">Brat-style lyric video</text>
    <text x="1180" y="622" class="cardBody" fill="#FBE9DF">Downloadable MP4</text>
    <text x="1180" y="651" class="cardBody" fill="#FBE9DF">Job status + file endpoint</text>
    <text x="1180" y="692" class="small" fill="#F9D5C7">/api/status/&lt;job_id&gt;</text>
    <text x="1180" y="716" class="small" fill="#F9D5C7">/api/download/&lt;job_id&gt;</text>
  </g>

  <path d="M370 335H408" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M730 335H768" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1090 335H1128" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M580 420V475" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M940 420V475" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M730 625H768" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1090 625H1128" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M583 751C610 820 700 848 845 848H1185" stroke="#8A5A3B" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="655" y="830" class="small">audio feeds recording + export</text>

  <path d="M943 751C970 820 1060 848 1185 848" stroke="#8A5A3B" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="980" y="875" class="small">timed lyrics drive on-screen typing</text>
</svg>
