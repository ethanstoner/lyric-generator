name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        env:
          # openai-whisper is an sdist that imports pkg_resources at build
          # time; setuptools>=81 removed it. Constrain the (isolated) build
          # env's setuptools so the wheel builds on Python 3.12.
          PIP_CONSTRAINT: ${{ github.workspace }}/ci-constraints.txt
        run: |
          echo "setuptools<81" > ci-constraints.txt
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -m "not live" -v
